name: Vercel

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_ORIGIN }}
      NEXT_PUBLIC_APP_ORIGIN: ${{ vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_CHANNEL_ORIGIN: ${{ vars.NEXT_PUBLIC_CHANNEL_ORIGIN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select target
        id: target
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          else
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify configuration
        shell: bash
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$NEXT_PUBLIC_APP_ORIGIN"
          test -n "$NEXT_PUBLIC_CHANNEL_ORIGIN"
          test -n "$VERCEL_TOKEN"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            test -n "$NEXT_PUBLIC_SITE_ORIGIN"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run security:scan && npm run precommit

      - name: Install Vercel CLI
        run: npm install --global vercel@58.0.0

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          args=(
            --yes
            --token="$VERCEL_TOKEN"
            --build-env NEXT_PUBLIC_APP_ORIGIN="$NEXT_PUBLIC_APP_ORIGIN"
            --build-env NEXT_PUBLIC_CHANNEL_ORIGIN="$NEXT_PUBLIC_CHANNEL_ORIGIN"
            --env NEXT_PUBLIC_APP_ORIGIN="$NEXT_PUBLIC_APP_ORIGIN"
            --env NEXT_PUBLIC_CHANNEL_ORIGIN="$NEXT_PUBLIC_CHANNEL_ORIGIN"
          )
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            args+=(
              --prod
              --build-env NEXT_PUBLIC_SITE_ORIGIN="$NEXT_PUBLIC_SITE_ORIGIN"
              --env NEXT_PUBLIC_SITE_ORIGIN="$NEXT_PUBLIC_SITE_ORIGIN"
            )
          fi
          deployment_url=$(vercel deploy "${args[@]}")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel ${{ steps.target.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
